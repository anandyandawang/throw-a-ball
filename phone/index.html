<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>throw a ball</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 1rem;
      color: #999;
      margin-bottom: 32px;
    }

    button {
      padding: 16px 48px;
      font-size: 1.1rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #333;
      color: #999;
      transition: all 0.2s ease;
      min-width: 200px;
      min-height: 56px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button-caption {
      font-size: 0.85rem;
      color: #666;
      margin-top: 8px;
      line-height: 1.4;
    }

    .footer {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>throw a ball</h1>
    <p class="tagline">phone-as-the-ball pitching trainer</p>
    <div>
      <button disabled>Start</button>
      <div class="button-caption">pairing arrives in a later milestone</div>
    </div>
  </div>

  <div class="footer" id="footer"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
